# =============================================================================
#  Build Overleaf CEP "base" image per arm64 (Raspberry Pi 5)
# =============================================================================
# Cosa fa:
#   Compila l'immagine di base (texlive scheme-full + dipendenze pesanti) del
#   fork "overleaf-cep" (yu-i-i/overleaf-cep, branch ext-ce - la stessa
#   sorgente da cui viene pubblicata l'immagine overleafcep/sharelatex che
#   usavi su Windows) per architettura linux/arm64, e la pubblica sul TUO
#   Docker Hub.
#
#   Va eseguita raramente (cambia poco): ~20-40 minuti su runner arm64 nativi
#   GitHub-hosted (ubuntu-24.04-arm), gratuiti sui repository pubblici.
#
# Setup richiesto (una tantum), nel repository GitHub dove metti questo file:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#        DOCKER_USERNAME = <il tuo username Docker Hub>
#        DOCKER_PASSWORD = <un Access Token Docker Hub, non la password>
#         (Docker Hub -> Account Settings -> Security -> New Access Token)
#   2. Assicurati che il repo sia PUBBLICO se vuoi i runner arm64 gratuiti,
#      altrimenti dovrai usare runner arm64 self-hosted o a pagamento.
#   3. Actions -> "Build Overleaf CEP base image (arm64)" -> Run workflow
#      (esecuzione manuale la prima volta; poi gira in automatico ogni mese)
#
# Al termine avrai pubblicato: docker.io/<DOCKER_USERNAME>/overleaf-base-arm64:latest
# =============================================================================

name: Build Overleaf CEP base image (arm64)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # una volta al mese

jobs:
  build-base:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout overleaf-cep (ext-ce)
        uses: actions/checkout@v4
        with:
          repository: yu-i-i/overleaf-cep
          ref: ext-ce
          path: overleaf

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Force scheme-full nel Dockerfile-base
        working-directory: overleaf
        run: |
          sed -i 's/scheme-basic/scheme-full/g' server-ce/Dockerfile-base

      - name: Build and push base image (arm64)
        working-directory: overleaf
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file server-ce/Dockerfile-base \
            --tag ${{ secrets.DOCKER_USERNAME }}/overleaf-base-arm64:latest \
            --push .
