# =============================================================================
#  Build Overleaf CEP "app" image per arm64 (Raspberry Pi 5)
# =============================================================================
# Cosa fa:
#   Compila l'immagine applicativa Overleaf (Node/web/clsi/ecc.) sopra la base
#   arm64 pubblicata da build-base-arm64.yml, e la pubblica sul tuo Docker Hub
#   come <DOCKER_USERNAME>/overleaf-cep-arm64:<versione> e :latest.
#
#   Esegui SEMPRE prima build-base-arm64.yml almeno una volta.
#   Questa gira in ~10-20 minuti su runner arm64 nativi.
#
# Setup richiesto: stessi secrets DOCKER_USERNAME / DOCKER_PASSWORD di
#   build-base-arm64.yml (li riusa).
#
# Questo workflow applica anche due patch custom UNIVAQ DIIIE, PRIMA di
# buildare l'immagine. Per questo, a differenza di build-base-arm64.yml,
# questo file richiede che nel TUO repository GitHub (quello dove hai messo
# questo workflow) esistano anche le cartelle:
#   patches/overleaf-admin-purge/     (purge progetti vecchi, pannello Admin)
#   patches/diiie-navbar-footer/      (Sign up esterno + offuscamento email)
# (copiale da raspberrypi/patches/ di questo progetto).
# Se uno step "Applica patch UNIVAQ DIIIE" fallisce, la build si interrompe
# (exit code diverso da 0): leggi l'errore nel log, indica esattamente quale
# file e quale testo non e' stato trovato — vedi README.md per come
# risolvere (sezioni sul purge dei progetti vecchi e sul footer/navbar).
#
# Uso:
#   Actions -> "Build Overleaf CEP app image (arm64)" -> Run workflow
#   - upstream_repo: di norma lascia vuoto (= yu-i-i/overleaf-cep, il fork con
#     le patch extra). Per versioni non presenti nel fork (es. 5.5.7, richiesta
#     dalla migrazione binary-files) metti "overleaf/overleaf" (repo ufficiale).
#   - upstream_tag: vuoto = ultima versione taggata, oppure una specifica
#     (es. 6.1.2-ext-v4.1 sul fork, o 5.5.7 sul repo ufficiale).
#   - apply_patch: lascia "true" per build normali. Metti "false" quando usi
#     upstream_repo=overleaf/overleaf per una versione intermedia come 5.5.7:
#     e' un'immagine temporanea solo per la migrazione, non serve la patch
#     admin, e gli anchor della patch potrebbero non esistere in quel tag.
#
# Al termine avrai pubblicato: docker.io/<DOCKER_USERNAME>/overleaf-cep-arm64:latest
# =============================================================================

name: Build Overleaf CEP app image (arm64)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Repository GitHub da compilare (default: il fork esteso)'
        required: false
        default: 'yu-i-i/overleaf-cep'
      upstream_tag:
        description: 'Tag da compilare (vuoto = ultimo tag disponibile sul repo scelto). Per versioni non presenti nel fork (es. 5.5.7, richiesta per la migrazione binary-files) usa upstream_repo=overleaf/overleaf'
        required: false
        default: ''
      apply_patch:
        description: 'Applica la patch UNIVAQ DIIIE "purge progetti vecchi"? Metti false per build di versioni vecchie/intermedie dove la patch potrebbe non applicarsi'
        required: false
        default: 'true'
  schedule:
    - cron: '0 4 * * 1'   # ogni lunedi

jobs:
  build-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout di questo repository (patch UNIVAQ DIIIE)
        uses: actions/checkout@v4
        # nessun "repository:"/"path:" esplicito => scarica il repo dove
        # vive questo workflow, nella working directory di default

      - name: Checkout sorgente Overleaf (fork o ufficiale)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.upstream_repo || 'yu-i-i/overleaf-cep' }}
          ref: ${{ (github.event.inputs.upstream_repo || 'yu-i-i/overleaf-cep') == 'yu-i-i/overleaf-cep' && 'ext-ce' || 'main' }}
          path: overleaf
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determina il tag da compilare
        id: meta
        working-directory: overleaf
        run: |
          if [ -n "${{ github.event.inputs.upstream_tag }}" ]; then
            TAG="${{ github.event.inputs.upstream_tag }}"
          else
            git fetch --tags
            TAG=$(git tag --sort=-v:refname | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "Nessun tag trovato, uso HEAD di ext-ce"
            TAG="no-tag"
          fi
          echo "Versione selezionata: $TAG"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout del tag selezionato
        if: steps.meta.outputs.version != 'no-tag'
        working-directory: overleaf
        run: git checkout ${{ steps.meta.outputs.version }}

      - name: Applica patch UNIVAQ DIIIE (purge progetti vecchi, pannello Admin)
        if: github.event.inputs.apply_patch != 'false'
        run: python3 patches/overleaf-admin-purge/apply-patch.py overleaf

      - name: Applica patch UNIVAQ DIIIE (Sign up esterno + offuscamento email)
        if: github.event.inputs.apply_patch != 'false'
        run: python3 patches/diiie-navbar-footer/apply-patch.py overleaf

      - name: Punta il Dockerfile alla nostra base arm64
        working-directory: overleaf
        run: |
          if ! grep -q "sharelatex/sharelatex-base" server-ce/Dockerfile; then
            echo "ERRORE: server-ce/Dockerfile di questo tag/repo non contiene piu' (o non ha mai contenuto)"
            echo "la riga 'FROM sharelatex/sharelatex-base...' che questo step sostituisce con la nostra"
            echo "base arm64. Probabilmente questo tag usa un nome/formato di immagine base diverso:"
            echo "controlla server-ce/Dockerfile manualmente e aggiorna il pattern sed qui sotto."
            grep -n "^FROM" server-ce/Dockerfile || true
            exit 1
          fi
          sed -i "s|sharelatex/sharelatex-base[^ ]*|${{ secrets.DOCKER_USERNAME }}/overleaf-base-arm64:latest|g" server-ce/Dockerfile
          echo "Dockerfile aggiornato:"
          grep -n "^FROM" server-ce/Dockerfile

      - name: Build and push app image (arm64)
        working-directory: overleaf
        run: |
          TAGS="--tag ${{ secrets.DOCKER_USERNAME }}/overleaf-cep-arm64:latest"
          if [ "${{ steps.meta.outputs.version }}" != "no-tag" ]; then
            TAGS="$TAGS --tag ${{ secrets.DOCKER_USERNAME }}/overleaf-cep-arm64:${{ steps.meta.outputs.version }}"
          fi
          docker buildx build \
            --platform linux/arm64 \
            --file server-ce/Dockerfile \
            $TAGS \
            --push .
